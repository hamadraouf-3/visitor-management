# Client authentication of the compose PostgreSQL service (docker-compose.yml passes
# `-c hba_file=/etc/postgresql/pg_hba.conf`; it replaces the file initdb writes, also during the
# image's first-start initialisation). First matching line wins.
#
# Over the network (the compose `db` network, where only the backend and migrate containers live) the
# two application roles may reach the application database, with SCRAM passwords. The superuser and
# every other role or database are refused over the network. The local socket is reachable only from
# inside the postgres container (`docker compose exec postgres ...`: backups, restores, psql), which
# already requires control of the Docker host.
#
# TLS between the API and PostgreSQL (DB_REQUIRE_TLS=true, sslmode=verify-full in both URLs): turn on
# ssl in docker-compose.yml (see the comment there) and change `host` to `hostssl` below, so a
# connection without TLS is refused by the server as well.

# TYPE  DATABASE  USER               ADDRESS   METHOD
local   all       all                          trust
host    vms       vms_owner,vms_app  all       scram-sha-256
host    all       all                all       reject
