# Headers of the JSON errors nginx answers itself on /api/ (413 body too large, 503 when the API cannot
# be reached). They mirror what the API sends on its own responses (backend app/core/middleware.py:
# _COMMON_HEADERS, _API_HEADERS and HSTS in production), so the SPA and the browser see the same
# envelope and the same protections whichever side answered.

add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Request-ID $request_id always;
