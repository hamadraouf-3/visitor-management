# Security headers of the web application (contract §10). Included in every location that serves the
# SPA or its static files. nginx inherits add_header only into locations that set none of their own,
# so each such location includes this file explicitly next to its Cache-Control.
#
# This list must stay identical to frontend/config/securityHeaders.ts (what `vite preview` serves and
# what the CSP compatibility checks ran against). deploy/verify/check_nginx_headers.mjs fails when the
# two differ; deploy/verify/smoke_test.py checks a running deployment against this file.
# Format (read by both checks): one header per line, add_header NAME "VALUE" always;
#
# 'wasm-unsafe-eval' compiles the self-hosted zxing WebAssembly QR decoder; nothing else needs more
# than 'self'. API responses carry the API's own, stricter headers (backend RequestContextMiddleware).

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
