# TLS policy (Mozilla "intermediate" profile, without the DHE suites so no dhparam file is needed).
# Included at the http level of templates/vms.conf.template, so it applies to every TLS listener,
# including the default server that receives the ClientHello before SNI selects the application's
# server. The certificate itself is set in the application's server block: docker-compose.yml mounts
# the operator's chain and key read-only at /etc/nginx/tls (see deploy/README.md).
#
# Key exchange groups are left to the TLS library's defaults (OpenSSL 3.5 offers the hybrid
# post-quantum X25519MLKEM768 first). For a TLS 1.3-only policy, set `ssl_protocols TLSv1.3;`.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:VMS_TLS:10m;
# Session tickets would reuse one ticket key for the container's lifetime; the shared cache resumes
# sessions without that key.
ssl_session_tickets off;
