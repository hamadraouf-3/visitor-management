# Reverse proxy to the API (contract §3: same origin, no CORS; §7.3: client IP). Included by the
# /api locations of templates/vms.conf.template, which each set their own client_max_body_size and
# proxy_request_buffering: this file must not (nginx refuses a directive given twice in one location).

# The instance comes from the method and the raw path ($vms_api_pool, templates/vms.conf.template): the
# main instance, or the one for the reception lists or for reports. The value is always the name of one
# of the three upstream groups, so nginx never resolves it as a host name. No URI part: nginx forwards
# the request URI as the client sent it, the path the map matched, which is what the API dispatches on
# (D9-36).
proxy_pass http://$vms_api_pool;
proxy_http_version 1.1;
# Keep-alive connections to the API. A client's Connection and Upgrade headers are never forwarded: the
# API has no WebSocket routes, and an upgrade must reach it as plain HTTP (SEC-45).
proxy_set_header Connection "";
proxy_set_header Host $host;
# The client address as nginx saw it, REPLACING whatever the client sent (overwrite, never append). The
# API believes this header only from TRUSTED_PROXIES (this proxy's own address) and uses the rightmost
# entry that is not a trusted proxy, so a client cannot choose its address in audit rows or rate limits.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx's request ID replaces the client's; the API adopts it only from a trusted proxy (SEC-12/16), so
# the nginx access log, the API log and the audit rows share one ID per request.
proxy_set_header X-Request-ID $request_id;
# Proxy headers the API does not read, cleared so that no future reader can believe a client's value.
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
# The API cannot steer nginx to internal locations or local files.
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
proxy_redirect off;

# Whether the request body is read before the API sees the request (proxy_request_buffering) is each
# location's own line: on everywhere, so that a slow client never ties up an API worker, and off for the
# upload of a brand image alone (templates/vms.conf.template says why). Answers are always buffered.
proxy_buffering on;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
# Long enough for the slowest legitimate request (a 366-day report, Argon2 hashing under load).
proxy_read_timeout 60s;

# Responses mix secrets (pass links, CSRF-protected data) with reflected input: no compression (BREACH).
gzip off;

# Errors nginx produces itself are answered in the API's JSON envelope. The API's own error responses
# (including its 503 SERVICE_BUSY) pass through untouched: proxy_intercept_errors stays off.
error_page 413 = @api_payload_too_large;
error_page 502 503 504 = @api_unavailable;
