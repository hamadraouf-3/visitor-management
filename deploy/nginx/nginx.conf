# Mawdoo3 Visitors - nginx main configuration (contract §10, §15; docs/decisions/phase-9-deploy.md).
#
# Baked into the frontend image (frontend/Dockerfile) as /etc/nginx/nginx.conf. The image is
# nginxinc/nginx-unprivileged: nginx runs as uid 101 and never as root, so there is no `user` directive,
# the pid file and every temporary path live in /tmp, and the listeners use ports above 1024 (8080, 8443).
# The root filesystem can be read-only (docker-compose.yml mounts tmpfs on /tmp and /etc/nginx/conf.d).
#
# The virtual servers are in templates/vms.conf.template, rendered at container start by the image's
# entrypoint (envsubst of the VMS_* variables only) into /etc/nginx/conf.d/vms.conf.

worker_processes 2;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
pcre_jit on;

# Errors only: nginx's own error lines quote the request line (query string included) of the request
# that failed, so the log level is kept where those lines are rare (upstream failures, refused bodies).
error_log /dev/stderr error;

events {
    worker_connections 2048;
}

http {
    # Writable paths of the unprivileged image (uid 101); /tmp is a tmpfs in docker-compose.yml.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Room for the "<method> <path>" keys of the API routing map ($vms_api_pool in
    # templates/vms.conf.template). The default is the CPU's cache line size (32 or 64 bytes), too small
    # for the longest key on some hosts. Must come before the first `map` block.
    map_hash_bucket_size 128;

    include /etc/nginx/mime.types;
    # Additions to the stock table (it maps .wasm to application/wasm already; the zxing decoder is
    # compiled with WebAssembly.instantiateStreaming, which refuses any other type).
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    charset utf-8;

    # No version in the Server header or on error pages.
    server_tokens off;

    # Access log: one JSON object per request. `uri` is the normalised path WITHOUT the query string
    # (contract §10: search terms and identifiers travel in query strings). After the SPA fallback, $uri
    # is /index.html, so `path` keeps the path the client asked for, also without the query string.
    # Never log $request, $request_uri, $args, $query_string or $http_referer.
    # `api_pool` is the upstream group that served an API request (vms_api, vms_api_reception or
    # vms_api_reports: templates/vms.conf.template), empty for everything nginx answers from files.
    # $vms_request_path is the path exactly as the client sent it, neither decoded nor normalised. The
    # API routing map of templates/vms.conf.template matches it too: it is the path nginx forwards to
    # the API (D9-36). Keep it the raw path; deploy/verify/test_api_instances.py checks it.
    map $request_uri $vms_request_path {
        "~^(?<path>[^?]*)" $path;
        default "";
    }
    log_format vms_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","path":"$vms_request_path","status":$status,'
        '"bytes_sent":$bytes_sent,"request_length":$request_length,"request_time":$request_time,'
        '"api_pool":"$proxy_host","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host","protocol":"$server_protocol","tls":"$ssl_protocol",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout vms_json;
    # Missing static files are answered 404 without an error-log line (that line quotes the request).
    log_not_found off;

    sendfile on;
    tcp_nopush on;
    # The content is immutable for the container's lifetime (baked into the image).
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    # Slow or idle clients are cut off instead of tying up connections. client_header_timeout is for the
    # whole request header. client_body_timeout is only the longest pause between two reads of a body: a
    # client that sends a byte every few seconds is not cut off by it, however long the body takes. So
    # nothing that is counted may be held while a body is read (the upload of a brand image,
    # templates/vms.conf.template).
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    # Request bodies: the API refuses bodies above MAX_REQUEST_BODY_BYTES (default 65536 bytes, every
    # contract body is far smaller). nginx refuses the same size first, so an oversized body never
    # reaches an API worker. Keep the two values equal. The API locations repeat the limit, and one of
    # them raises it for one path: the upload of a company's brand image, a PNG of at most 512 KiB
    # (templates/vms.conf.template). That body is passed on while it arrives, so the buffer below is
    # the most nginx holds of any body, the upload's included.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # Compression for the static application (HTML, JS, CSS, SVG, the manifest, the wasm decoder).
    # API responses are not compressed (see the /api/ location): they mix secrets with reflected input.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json
               image/svg+xml application/wasm text/plain;

    include /etc/nginx/conf.d/*.conf;
}
